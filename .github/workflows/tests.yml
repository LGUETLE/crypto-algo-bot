name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"      # pandas-ta 0.3.14b does not build on newer Pythons
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v
